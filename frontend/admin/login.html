<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - TAL CUAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/styles/tokens.css" />
  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/components.css" />
  <link rel="stylesheet" href="/frontend/styles/admin.css" />
</head>
<body class="admin-body">
  <main class="login-wrap">
    <div class="login-card">
      <div class="login-card__logo">
        <span style="font-size: 28px; font-weight: 800; color: var(--tc-primary);">TAL CUAL</span>
      </div>
      <h1 class="login-card__title">Admin</h1>
      <p class="login-card__subtitle">Ingresa tus credenciales para continuar</p>
      <div class="login-alert" id="loginAlert"></div>
      <form id="loginForm">
        <div class="field" style="margin-bottom: var(--tc-sp-md);">
          <label class="field__label" for="email">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group__icon material-symbols-outlined">mail</span>
            <input class="input" id="email" type="email" placeholder="admin@talcual.com" required />
          </div>
        </div>
        <div class="field" style="margin-bottom: var(--tc-sp-lg);">
          <label class="field__label" for="password">Contraseña</label>
          <div class="input-group">
            <span class="input-group__icon material-symbols-outlined">lock</span>
            <input class="input" id="password" type="password" placeholder="••••••••" required />
          </div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Iniciar Sesión</button>
      </form>
    </div>
  </main>
  <script type="module" src="/frontend/scripts/admin.js"></script>
</body>
</html>
