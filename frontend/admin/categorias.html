<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorías - TAL CUAL Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/styles/tokens.css" />
  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/components.css" />
  <link rel="stylesheet" href="/frontend/styles/admin.css" />
</head>
<body class="admin-body">
  <admin-topbar data-page="categorias"></admin-topbar>
  <main class="admin-main">
    <div class="admin-toolbar">
      <div class="admin-toolbar__title">
        <h1>Gestión de Categorías</h1>
        <p>Administra las categorías de productos del catálogo.</p>
      </div>
      <button class="btn btn-primary" id="addCategoryBtn">
        <span class="material-symbols-outlined">add</span> Nueva Categoría
      </button>
    </div>
    <div class="table-card">
      <div class="table-wrap">
        <table class="tc-table" id="categoriesTable">
          <thead>
            <tr><th>ID</th><th>Nombre</th><th>Orden</th><th style="text-align:right;">Acciones</th></tr>
          </thead>
          <tbody id="categoriesBody">
            <tr><td colspan="4" style="text-align:center; color: var(--tc-text-muted); padding: 40px;">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="categoryModal" style="display:none;">
    <div class="modal" style="max-width:480px;">
      <div class="modal__header">
        <h2 id="modalTitle">Nueva Categoría</h2>
        <button class="modal__close" id="modalClose"><span class="material-symbols-outlined">close</span></button>
      </div>
      <form id="categoryForm" class="form">
        <input type="hidden" id="editId" />
        <div class="form__group">
          <label class="form__label">ID (slug)</label>
          <input type="text" class="input" id="catId" required placeholder="ej: electronica" />
        </div>
        <div class="form__group">
          <label class="form__label">Nombre</label>
          <input type="text" class="input" id="catName" required placeholder="ej: Electrónica" />
        </div>
        <div class="form__group">
          <label class="form__label">Orden de visualización</label>
          <input type="number" class="input" id="catOrder" value="0" min="0" />
        </div>
        <div class="form__actions">
          <button type="button" class="btn btn-outline" id="modalCancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/frontend/scripts/admin.js"></script>
</body>
</html>
