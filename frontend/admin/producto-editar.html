<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editar Producto - TAL CUAL Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/styles/tokens.css" />
  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/components.css" />
  <link rel="stylesheet" href="/frontend/styles/admin.css" />
</head>
<body class="admin-body">
  <admin-topbar data-page="catalogo"></admin-topbar>
  <main class="admin-main">
    <div style="max-width: 800px; margin-inline: auto;">
      <div style="margin-bottom: var(--tc-sp-lg);">
        <h1>Editar Producto</h1>
        <p style="color: var(--tc-text-muted);">Actualiza los datos del producto.</p>
      </div>
      <form id="productEditForm" class="stack-lg">
        <div class="admin-card">
          <h2 class="admin-card__title">Información Básica</h2>
          <div class="form-grid">
            <div class="form-grid__full field"><label class="field__label">Título del Producto</label><input class="input" id="editTitle" required /></div>
            <div class="field"><label class="field__label">Categoría</label><select class="select" id="editCategory"><option value="">Seleccionar</option></select></div>
            <div class="field"><label class="field__label">Precio (USD)</label><div class="input-group"><span class="input-group__icon">$</span><input class="input" id="editPrice" type="number" step="0.01" min="0" required /></div></div>
            <div class="field"><label class="field__label">Estado</label><select class="select" id="editStatus"><option value="active">Activo</option><option value="inactive">Inactivo</option><option value="sold">Vendido</option></select></div>
          </div>
        </div>
        <div class="admin-card">
          <h2 class="admin-card__title">Detalles</h2>
          <div class="form-grid">
            <div class="form-grid__full field"><label class="field__label">Descripción</label><textarea class="textarea" id="editDescription" rows="4"></textarea></div>
            <div class="form-grid__full field"><label class="field__label">Condición</label><div class="radio-group" id="editConditionGroup"></div></div>
          </div>
        </div>
        <div class="admin-card">
          <h2 class="admin-card__title">Imagen</h2>
          <div class="dropzone" id="editImageDropzone">
            <div class="dropzone__icon"><span class="material-symbols-outlined" style="font-size: 32px;">cloud_upload</span></div>
            <p class="dropzone__title">Arrastra y suelta la imagen aquí</p>
            <p class="dropzone__hint">o haz clic para seleccionar. JPG/PNG. Máx 5MB.</p>
            <input type="file" accept="image/*" style="display:none" id="editImageInput" />
          </div>
          <div style="margin-top: var(--tc-sp-md); text-align: center;" id="editImagePreviewWrap">
            <img id="editImagePreview" style="max-height: 200px; border-radius: var(--tc-radius-md);" />
            <div style="display:flex; gap:var(--tc-sp-sm); justify-content:center; margin-top:6px;">
              <button type="button" class="btn btn-outline btn-sm" id="editImageRemove">Eliminar imagen</button>
              <p style="color: var(--tc-text-muted); font-size: 13px; margin-top: 4px;" id="editImageUrlPreview"></p>
            </div>
          </div>
          <input type="hidden" id="editImage" value="" />
        </div>
        <div class="admin-card">
          <h2 class="admin-card__title">Tipo de Producto</h2>
          <div class="form-grid">
            <div class="field">
              <label class="field__label">Tipo</label>
              <select class="select" id="editType">
                <option value="regular">Producto regular</option>
                <option value="consigned">Consignado</option>
              </select>
            </div>
            <div class="field" id="editOwnerFields" style="display:none;">
              <div class="form-grid__full field"><label class="field__label">Nombre del dueño</label><input class="input" id="editOwnerName" placeholder="Nombre del consignador" /></div>
              <div class="form-grid__full field"><label class="field__label">Contacto del dueño</label><input class="input" id="editOwnerContact" placeholder="Teléfono / email" /></div>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <a href="/admin/catalogo" class="btn btn-ghost">Cancelar</a>
          <button class="btn btn-cta" type="submit"><span class="material-symbols-outlined">save</span> Guardar Cambios</button>
        </div>
      </form>
    </div>
  </main>
  <script type="module" src="/frontend/scripts/admin.js"></script>
</body>
</html>
