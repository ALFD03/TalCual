<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Producto - TAL CUAL Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/styles/tokens.css" />
  <link rel="stylesheet" href="/frontend/styles/base.css" />
  <link rel="stylesheet" href="/frontend/styles/components.css" />
  <link rel="stylesheet" href="/frontend/styles/admin.css" />
</head>
<body class="admin-body">
  <admin-topbar data-page="catalogo"></admin-topbar>
  <main class="admin-main">
    <div style="max-width: 800px; margin-inline: auto;">
      <div style="margin-bottom: var(--tc-sp-lg);">
        <h1>Agregar Nuevo Producto</h1>
        <p style="color: var(--tc-text-muted);">Completa los detalles para listar un nuevo artículo en el catálogo circular.</p>
      </div>
      <form id="productForm" class="stack-lg">
        <div class="admin-card">
          <h2 class="admin-card__title">Información Básica</h2>
          <div class="form-grid">
            <div class="form-grid__full field"><label class="field__label">Título del Producto</label><input class="input" id="prodTitle" placeholder="Ej. Chaqueta Vintage de Cuero" required /></div>
            <div class="field"><label class="field__label">Categoría</label><select class="select" id="prodCategory" required><option value="">Seleccionar</option></select></div>
            <div class="field"><label class="field__label">Precio (USD)</label><div class="input-group"><span class="input-group__icon">$</span><input class="input" id="prodPrice" type="number" step="0.01" min="0" placeholder="0.00" required /></div></div>
          </div>
        </div>
        <div class="admin-card">
          <h2 class="admin-card__title">Detalles del Producto</h2>
          <div class="form-grid">
            <div class="form-grid__full field"><label class="field__label">Descripción</label><textarea class="textarea" id="prodDescription" rows="4" placeholder="Describe el estado, materiales, marca..."></textarea></div>
            <div class="form-grid__full field"><label class="field__label">Condición</label><div class="radio-group" id="conditionGroup"><label class="radio-item"><input type="radio" name="condition" value="nuevo" /><span class="radio-item__label">Nuevo</span></label><label class="radio-item"><input type="radio" name="condition" value="como_nuevo" checked /><span class="radio-item__label">Como nuevo</span></label><label class="radio-item"><input type="radio" name="condition" value="segunda_mano" /><span class="radio-item__label">Segunda mano</span></label></div></div>
          </div>
        </div>
        <div class="admin-card">
          <h2 class="admin-card__title">Imagen</h2>
          <div class="dropzone" id="imageDropzone">
            <div class="dropzone__icon"><span class="material-symbols-outlined" style="font-size: 32px;">cloud_upload</span></div>
            <p class="dropzone__title">Arrastra y suelta la imagen aquí</p>
            <p class="dropzone__hint">o haz clic para seleccionar. JPG/PNG. Máx 5MB.</p>
            <input type="file" accept="image/*" style="display:none" id="imageInput" />
          </div>
          <div style="display: none; margin-top: var(--tc-sp-md); text-align: center;" id="imagePreviewWrap">
            <img id="imagePreview" style="max-height: 200px; border-radius: var(--tc-radius-md);" />
            <p style="color: var(--tc-text-muted); font-size: 13px; margin-top: 4px;" id="imageUrlPreview"></p>
          </div>
          <input type="hidden" id="prodImage" value="" />
        </div>
        <div class="form-actions">
          <a href="/admin/catalogo" class="btn btn-ghost">Cancelar</a>
          <button class="btn btn-cta" type="submit"><span class="material-symbols-outlined">save</span> Guardar Producto</button>
        </div>
      </form>
    </div>
  </main>
  <script type="module" src="/frontend/scripts/admin.js"></script>
</body>
</html>
